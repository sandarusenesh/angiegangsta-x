services:
  - type: web
    name: angiegangsta-x
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: OWNER_NAME
        value: Angie
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        value: .
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: PAIR_PHONE
        sync: false
